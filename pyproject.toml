[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-race-project"
version = "0.1.0"
description = "Formula 1 race telemetry simulation, analytics, visualization, and ML baselines"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "M-Samouh" }
]
dependencies = [
  "kagglehub>=0.3.10",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
  "pyarrow>=17.0.0",
  "scikit-learn>=1.5.0",
  "streamlit>=1.39.0",
  "duckdb>=1.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
